realm: "$(env:KEYCLOAK_REALM)"

users:
  - username: coolture_admin
    enabled: true
    emailVerified: true
    firstName: Coolture
    lastName: Admin
    email: coolture_admin@mail.com
    credentials:
      - type: password
        userLabel: "My password"
        value: "$(env:KEYCLOAK_TEST_USERS_PASSWORD)"
        temporary: false
    groups:
      - /coolture-admins
      - /coolture-users

  - username: coolture_user
    enabled: true
    emailVerified: true
    firstName: Coolture
    lastName: User
    email: coolture_user@mail.com
    credentials:
      - type: password
        userLabel: "My password"
        value: "$(env:KEYCLOAK_TEST_USERS_PASSWORD)"
        temporary: false
    groups:
      - /coolture-users

  - username: "service-account-$(env:KEYCLOAK_COOLTURE_BOT_CLIENT_ID)"
    serviceAccountClientId: "$(env:KEYCLOAK_COOLTURE_BOT_CLIENT_ID)"
    enabled: true
    clientRoles:
      $(env:KEYCLOAK_COOLTURE_GATEWAY_CLIENT_ID):
        - ROLE_COOLTURE_USER
        - ROLE_COOLTURE_ADMIN
