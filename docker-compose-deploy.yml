services:
  s3garage:
    image: dxflrs/garage:v2.2.0
    hostname: ${GARAGE_HOSTNAME:-s3garage}
    restart: unless-stopped
    ports:
      - "${GARAGE_API_HOST_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_HOST_PORT:-3910}:3910"
    networks:
      - devnet
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_METRICS_TOKEN=${GARAGE_METRICS_TOKEN}

  s3garage-ui:
    image: khairul169/garage-webui:latest
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "${GARAGE_UI_HOST_PORT:-3920}:3909"
    networks:
      - devnet
    environment:
      - API_BASE_URL=http://${GARAGE_HOSTNAME:-s3garage}:3910
      - API_ADMIN_KEY=${GARAGE_ADMIN_TOKEN}
      - S3_ENDPOINT_URL=http://${GARAGE_HOSTNAME:-s3garage}:3900
      - S3_REGION=${GARAGE_REGION:-garage}

  s3-init:
    image: docker.io/alpine:3.23
    depends_on:
      s3garage:
        condition: service_started
    network_mode: service:s3garage
    pid: service:s3garage
    volumes:
      - ./garage/init.sh:/init.sh:ro
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      GARAGE_ACCESS_KEY_SECRET: ${GARAGE_ACCESS_KEY_SECRET}
      GARAGE_BUCKET_NAME: ${GARAGE_BUCKET_NAME}
      GARAGE_KEY_NAME: ${GARAGE_KEY_NAME}
    restart: on-failure:3
    entrypoint: ["/bin/sh", "/init.sh"]

  # Realm files in ./keycloak/import apply only on first startup (empty keycloak_data volume).
  # If you still see "Invalid parameter: redirect_uri" after editing realm.json, remove the volume
  # and recreate: docker compose -f docker-compose-deploy.yml down && docker volume rm <stack>_keycloak_data
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    hostname: ${KEYCLOAK_HOSTNAME:-keycloak}
    env_file: .env
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true" # Enable non secure HTTP for development
      # Public host browsers use to reach Keycloak (must match token issuer and OAuth redirects)
      KC_HOSTNAME: ${COOLTURE_PUBLIC_HOST:-localhost}
      COOLTURE_PUBLIC_HOST: ${COOLTURE_PUBLIC_HOST:-localhost}
      # Served to browsers at https://$HOST/keycloak/ via nginx (avoids HTTP Keycloak iframes on HTTPS pages)
      KC_HTTP_RELATIVE_PATH: keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_PORT: ${KEYCLOAK_PORT:-8180}
      KC_HTTP_MANAGEMENT_PORT: ${KEYCLOAK_MANAGEMENT_PORT:-8181}
      KC_HOSTNAME_STRICT: "false" # Allow requests from non-specifed domain in dev env (e.g. localhost:port)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      JAVA_OPTS: "-Dkeycloak.migration.replace-placeholders=true"
      # There is no need for DB setting bcs keycloak uses H2 in dev mode
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/export:/tmp/export
    ports:
      - ${KEYCLOAK_PORT:-8180}:8180
      - ${KEYCLOAK_MANAGEMENT_PORT:-8181}:8181
    networks:
      - devnet
    healthcheck:
      # Keycloak container does not have any CLI HTTP clients installed:
      # https://www.keycloak.org/observability/health#_healthcheck
      # https://stackoverflow.com/questions/58168955/testing-minimal-docker-containers-with-healthcheck/76790330#76790330
      # https://www.reddit.com/r/KeyCloak/comments/14a5a1y/how_to_enable_healthcheck_on_keycloak_on/
      test:
        - "CMD"
        - "bash"
        - "-c"
        - |
          exec 3<>/dev/tcp/${KEYCLOAK_HEALTHCHECK_BIND_ADDR:-127.0.0.1}/8181
          printf 'GET /keycloak/health HTTP/1.1\r\nHost: ${KEYCLOAK_HEALTHCHECK_HTTP_HOST:-localhost}\r\nConnection: close\r\n\r\n' >&3
          cat <&3 | grep '200'
      interval: 5s
      timeout: 5s
      retries: 10
      # Dev + realm import often needs >10s before management port answers
      start_period: 45s
    command: start-dev --import-realm

  postgres:
    image: postgres:18.3-alpine
    hostname: postgres
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-coolture_db}
    volumes:
      # from postgres 18, data is stored in /var/lib/postgresql instead of /var/lib/postgresql/data
      - postgres_data:/var/lib/postgresql
    ports:
      # Default 5433 avoids clash with PostgreSQL often already bound on the host at 5432
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - devnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-coolture_db} -h ${POSTGRES_HEALTHCHECK_HOST:-localhost} -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      COOLTURE_PUBLIC_HOST: ${COOLTURE_PUBLIC_HOST:-localhost}
      # https when TLS terminates in front of nginx (CORS + forwarded request URLs)
      COOLTURE_PUBLIC_SCHEME: ${COOLTURE_PUBLIC_SCHEME:-https}
      # Browser OIDC base (no /realms/...). Deploy: https://$COOLTURE_PUBLIC_HOST/keycloak
      COOLTURE_KEYCLOAK_AUTH_BASE: ${COOLTURE_KEYCLOAK_AUTH_BASE:-https://${COOLTURE_PUBLIC_HOST}/keycloak}
      COOLTURE_KEYCLOAK_INTERNAL_BASE: ${COOLTURE_KEYCLOAK_INTERNAL_BASE:-http://keycloak:8180/keycloak}
      # Public URL port for OAuth redirect_uri (nginx listens on NGINX_HTTP_PORT, usually 80)
      GATEWAY_HOST_PORT: ${GATEWAY_HOST_PORT:-80}
      REST_API_HOST_PORT: ${REST_API_HOST_PORT:-8081}
      # SPA URL port for post-login redirect (80 when served only via nginx on :80)
      COOLTURE_FRONTEND_PORT: ${COOLTURE_FRONTEND_PORT:-80}
      GATEWAY_REST_API_URI: http://app:8081
    expose:
      - "8080"
    ports:
      - "${REST_API_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://${COOLTURE_APP_ACTUATOR_HOST:-127.0.0.1}:8081/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - devnet

  frontend:
    image: chriskondracki/coolture-frontend-dev:latest
    restart: unless-stopped
    expose:
      - "4000"
    networks:
      - devnet

  # Single public HTTP entry: http://$COOLTURE_PUBLIC_HOST/ — proxies / → SPA, gateway paths → app:8080
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    environment:
      GARAGE_BUCKET_NAME: ${GARAGE_BUCKET_NAME:-coolture-bucket}
      COOLTURE_PUBLIC_HOST: ${COOLTURE_PUBLIC_HOST:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    depends_on:
      keycloak:
        condition: service_healthy
      app:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - devnet

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 coolture-core-frontend-1 coolture-core-app-1
    networks:
      - devnet

volumes:
  keycloak_data:
  garage_data:
  garage_meta:
  postgres_data:

networks:
  devnet:
    driver: bridge
