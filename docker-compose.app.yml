services:
  gateway:
    build: ./gateway
    hostname: ${GATEWAY_INTERNAL_HOSTNAME:-gateway}
    env_file: .env
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:${GATEWAY_INTERNAL_PORT:-8080}"
    networks:
      - devnet
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully

  rest-api:
    build: ./rest-api
    hostname: ${REST_API_INTERNAL_HOSTNAME:-rest-api}
    env_file: .env
    ports:
      - "${REST_API_HOST_PORT:-8081}:${REST_API_INTERNAL_PORT:-8081}"
    networks:
      - devnet
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully

  embedding-worker:
    build: ./embedding-worker
    networks:
      - devnet
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_CONNECT_HOSTNAME: ${RABBITMQ_INTERNAL_HOSTNAME:-rabbitmq}
      RABBITMQ_CONNECT_PORT: ${RABBITMQ_INTERNAL_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    restart: on-failure