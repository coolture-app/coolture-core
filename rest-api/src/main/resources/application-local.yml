server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:local_db;DB_CLOSE_ON_EXIT=FALSE;
    driver-class-name: org.h2.Driver
    username: admin
    password: admin

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    database: h2
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: create-drop

  web:
    error:
      include-exception: true
      include-stacktrace: always
      include-message: always
      include-binding-errors: always

  devtools:
    livereload:
      enabled: true

logging:
  level:
    root: INFO
    web: DEBUG
    pl.coolture: DEBUG