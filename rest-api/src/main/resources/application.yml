server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: rest-api


  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

storage:
  s3:
    endpoint: http://localhost:${GARAGE_API_HOST_PORT}
    region: garage
    access-key: ${GARAGE_ACCESS_KEY_ID}
    secret-key: ${GARAGE_ACCESS_KEY_SECRET}
    bucket-name: ${GARAGE_BUCKET_NAME}

management:
  endpoints:
    web:
      exposure:
        include: [health, info]

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    oauth:
      client-id: coolture-swagger
      client-secret: ${KEYCLOAK_COOLTURE_SWAGGER_CLIENT_SECRET}
      use-pkce-with-authorization-code-grant: true
