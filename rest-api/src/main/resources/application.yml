server:
  port: ${REST_API_INTERNAL_PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: ${REST_API_INTERNAL_HOSTNAME:rest-api}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Must match with "iss" in JWT which has KC_HOSTNAME as a public address
          issuer-uri: http://${HOST_NAME:localhost}:${KEYCLOAK_HOST_PORT:8180}/realms/${KEYCLOAK_REALM:coolture-dev}
          # JWK is fetched on backend side (inside private network or when developing locally INTERNAL_HOSTNAME == HOSTNAME)
          jwk-set-uri: http://${KEYCLOAK_CONNECT_HOSTNAME:localhost}:${KEYCLOAK_CONNECT_PORT:8180}/realms/${KEYCLOAK_REALM:coolture-dev}/protocol/openid-connect/certs

  datasource:
    url: jdbc:postgresql://${POSTGRES_CONNECT_HOSTNAME:localhost}:${POSTGRES_CONNECT_PORT:5432}/${POSTGRES_DB:coolture_db}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

storage:
  s3:
    internal-endpoint: http://${GARAGE_API_CONNECT_HOSTNAME:localhost}:${GARAGE_API_CONNECT_PORT:3900}
    public-endpoint: http://${HOST_NAME:localhost}:${GARAGE_API_HOST_PORT:3900}
    region: ${GARAGE_REGION:garage}
    access-key: ${GARAGE_ACCESS_KEY_ID}
    secret-key: ${GARAGE_ACCESS_KEY_SECRET}
    bucket-name: ${GARAGE_BUCKET_NAME:coolture-bucket}

management:
  endpoints:
    web:
      exposure:
        include: [health, info]

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    oauth2RedirectUrl: http://${HOST_NAME:localhost}:${GATEWAY_HOST_PORT:8090}/api/swagger-ui/oauth2-redirect.html
    oauth:
      client-id: ${KEYCLOAK_COOLTURE_SWAGGER_CLIENT_ID}
      client-secret: ${KEYCLOAK_COOLTURE_SWAGGER_CLIENT_SECRET}
      use-pkce-with-authorization-code-grant: true

logging:
  level:
    root: INFO
    web: DEBUG
    pl.coolture: DEBUG

env:
  host:
    addr: ${HOST_NAME:localhost}
    gateway-port: ${GATEWAY_HOST_PORT:8090}
    rest-api-port: ${REST_API_HOST_PORT:8091}
  keycloak:
    client-id: ${KEYCLOAK_COOLTURE_GATEWAY_CLIENT_ID}
    open-id-url: http://${HOST_NAME:localhost}:${KEYCLOAK_HOST_PORT:8180}/realms/${KEYCLOAK_REALM:coolture-dev}/protocol/openid-connect/