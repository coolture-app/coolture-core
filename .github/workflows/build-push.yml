---
name: Build & Push Backend Image

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:
jobs:
  build-and-push:
    name: Build & Push Backend Image
    runs-on: self-hosted
    concurrency:
      group: build-and-push
      cancel-in-progress: false

    env:
      REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
      IMAGE_TAG: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set branch suffix
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "BRANCH=" >> $GITHUB_ENV
          else
            echo "BRANCH=-dev" >> $GITHUB_ENV
          fi

      - name: Build and push API image
        run: |
          set -u
          IMAGE="${REGISTRY}/${REPOSITORY}${BRANCH}:${IMAGE_TAG}"
          docker build -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Image pushed to $IMAGE"
