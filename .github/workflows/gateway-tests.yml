---
name: Gateway Tests

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-tests.yml"
  workflow_dispatch:

jobs:
  test-gateway:
    name: Gateway Maven Verify
    runs-on: [self-hosted, docker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run gateway tests and checks
        run: ./mvnw verify
        working-directory: gateway
