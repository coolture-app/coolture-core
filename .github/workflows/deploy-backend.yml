---
name: Deploy Backend

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: [self-hosted, deployer]
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /home/admin/coolture/dev/coolture-core
      DEPLOY_HOST_NAME: ${{ vars.DEPLOY_HOST_NAME }}
      BRANCH: ${{ github.ref_name }}

    steps:
      - name: Fix git safe directory
        run: git config --global --add safe.directory "$DEPLOY_DIR"

      - name: Update deploy repository
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          if [ ! -d ".git" ]; then
            echo "Missing git repository in $PWD"
            exit 1
          fi
          git fetch --all --prune
          git checkout "${{ env.BRANCH }}"
          git reset --hard "origin/${{ env.BRANCH }}"
          git clean -fd

      - name: Generate environment file first
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          GARAGE_RPC_SECRET: ${{ secrets.GARAGE_RPC_SECRET }}
          GARAGE_ADMIN_TOKEN: ${{ secrets.GARAGE_ADMIN_TOKEN }}
          GARAGE_METRICS_TOKEN: ${{ secrets.GARAGE_METRICS_TOKEN }}
          GARAGE_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          GARAGE_ACCESS_KEY_SECRET: ${{ secrets.GARAGE_ACCESS_KEY_SECRET }}
        run: |
          HOST_NAME_VALUE="${DEPLOY_HOST_NAME:-localhost}"
          make env ENV=deploy HOST_NAME="$HOST_NAME_VALUE" H_GATEWAY_PORT=8090

      - name: Ensure shared Docker network exists
        run: docker network inspect coolture-core_devnet || docker network create coolture-core_devnet

      - name: Deploy backend stack
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker-compose -f ${{ env.DEPLOY_DIR }}/docker-compose.base.yml -f ${{ env.DEPLOY_DIR }}/docker-compose.app.yml up --build -d --remove-orphans

      - name: Reapply Keycloak config
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker-compose -f ${{ env.DEPLOY_DIR }}/docker-compose.base.yml -f ${{ env.DEPLOY_DIR }}/docker-compose.app.yml up -d --force-recreate --no-deps keycloak-config