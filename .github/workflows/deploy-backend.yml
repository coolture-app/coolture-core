---
name: Deploy Backend

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches:
      - "dev"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: [self-hosted, deployer]
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /opt/coolture/dev/backend
      DEPLOY_HOST_NAME: ${{ vars.DEPLOY_HOST_NAME }}

    steps:
      - name: Update deploy repository
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          if [ ! -d ".git" ]; then
            echo "Missing git repository in $PWD"
            exit 1
          fi

          git fetch --all --prune
          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Generate environment file first
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          HOST_NAME_VALUE="${DEPLOY_HOST_NAME:-localhost}"
          make env ENV=deploy HOST_NAME="$HOST_NAME_VALUE"

      - name: Deploy backend stack
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker-compose -f docker-compose.base.yml -f docker-compose.app.yml up --build -d
