server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true

spring:
  application:
    name: gateway

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
