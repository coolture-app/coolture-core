spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            # Explicit URIs bypass the issuer-match check at startup entirely
            authorization-uri: ${coolture.keycloak.auth-base}/realms/coolture-dev/protocol/openid-connect/auth
            token-uri: ${coolture.keycloak.internal-base}/realms/coolture-dev/protocol/openid-connect/token
            jwk-set-uri: ${coolture.keycloak.internal-base}/realms/coolture-dev/protocol/openid-connect/certs
            user-info-uri: ${coolture.keycloak.internal-base}/realms/coolture-dev/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: ${KEYCLOAK_COOLTURE_GATEWAY_CLIENT_ID}
            client-secret: ${KEYCLOAK_COOLTURE_GATEWAY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - roles

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: api
              uri: ${GATEWAY_REST_API_URI:http://${COOLTURE_GATEWAY_BACKEND_HOST:localhost}:${REST_API_HOST_PORT:8081}}
              predicates:
                - Path=/api/**
              filters:
                - TokenRelay=
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - RemoveRequestHeader=Cookie
            - id: s3
              uri: http://s3garage:3900
              predicates:
                - Path=/${GARAGE_BUCKET_NAME}/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - RemoveRequestHeader=Cookie
